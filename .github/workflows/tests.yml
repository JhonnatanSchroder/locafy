name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application and build production assets
        run: composer setup

      - name: Run frontend lint
        run: npm run check -- --no-fmt

      - name: Run TypeScript checks
        run: npm run types:check

      - name: Verify changed frontend files are formatted
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.css' '*.cjs' '*.cts' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mjs' '*.mts' '*.ts' '*.tsx' '*.vue' '*.yaml' '*.yml'
          )

          if (( ${#files[@]} )); then
            ./node_modules/.bin/vp fmt --check "${files[@]}"
          fi

  backend:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application
        run: composer setup

      - name: Verify changed PHP files are formatted
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- '*.php'
          )

          if (( ${#files[@]} )); then
            ./vendor/bin/pint --parallel --test "${files[@]}"
          fi

      - name: Run PHPStan
        run: composer types:check

      - name: Run Laravel tests
        run: php artisan test
