name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application and build production assets
        run: composer setup

      - name: TEMPORARY diagnostic frontend formatter export
        shell: bash
        run: |
          for file in resources/js/components/contracts/ContractOperations.vue resources/js/pages/contracts/Index.vue; do
            ./node_modules/.bin/vp fmt "$file"
            echo "__FMT_START__:$file"
            cat "$file"
            echo "__FMT_END__:$file"
          done

      - name: Run frontend lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.vue'
          )

          if (( ${#files[@]} )); then
            ./node_modules/.bin/vp check --no-fmt "${files[@]}"
          else
            echo "No changed frontend source files to lint."
          fi

      - name: Run TypeScript checks
        id: types
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run types:check

      - name: Verify changed frontend files are formatted
        id: format
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.css' '*.cjs' '*.cts' '*.html' '*.js' '*.json' '*.jsx' '*.md' '*.mjs' '*.mts' '*.ts' '*.tsx' '*.vue'
          )

          if (( ${#files[@]} )); then
            ./node_modules/.bin/vp fmt --check "${files[@]}"
          else
            echo "No changed frontend files eligible for formatting."
          fi

      - name: Report frontend validation result
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.format.outcome }}" = success

  backend:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application
        run: composer setup

      - name: Verify changed PHP files are formatted
        id: format
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- 'app/**/*.php'
          )

          if (( ${#files[@]} )); then
            ./vendor/bin/pint --parallel --test "${files[@]}"
          else
            echo "No changed PHP files to format."
          fi

      - name: Run PHPStan
        id: phpstan
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- 'app/**/*.php'
          )

          if (( ${#files[@]} )); then
            ./vendor/bin/phpstan analyse --configuration=phpstan.neon "${files[@]}"
          else
            echo "No changed PHP files to analyze."
          fi

      - name: Run Laravel tests
        id: tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: php artisan test

      - name: Report backend validation result
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.phpstan.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
